name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit -p .
      - run: npm test

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Termux rootfs
        run: node scripts/package-rootfs.ts
      - name: Server dependencies for Android arm64, no lifecycle scripts
        run: npm ci --omit=dev --ignore-scripts --os=android --cpu=arm64
      - name: Server runtime
        run: node scripts/package-runtime.ts
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pi-phone.jks"
      - name: APK
        working-directory: android
        env:
          PI_PHONE_KEYSTORE: ${{ runner.temp }}/pi-phone.jks
          PI_PHONE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PI_PHONE_VERSION_CODE: ${{ github.run_number }}
        run: bash ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pi-phone-aarch64
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/src/main/assets/termux-packages.json
            android/app/src/main/assets/runtime-version
          if-no-files-found: error
          retention-days: 14
