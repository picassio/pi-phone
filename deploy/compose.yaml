# pi-phone server edition behind Caddy (HTTPS). See deploy/README.md.
#
#   cd deploy && PI_HOST=devbox.example.ts.net docker compose up -d
#
# PI_HOST is the name people open. PI_TLS picks Caddy's certificate: `auto` (Let's Encrypt for a public name, or
# Tailscale's for a *.ts.net name, with the tailscaled socket mounted below) or `internal` (Caddy's own CA, which each
# device must trust).
services:
  pi-phone:
    image: ghcr.io/picassio/pi-phone-server:${PI_PHONE_TAG:-latest}
    build:
      context: ..
    restart: unless-stopped
    volumes:
      - pi-phone-data:/data
    environment:
      TZ: ${TZ:-UTC}
    # Not published: only Caddy reaches it.
    expose:
      - "8787"
    networks: [pi-phone]

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on: [pi-phone]
    ports:
      - "80:80"
      - "443:443"
    environment:
      PI_HOST: ${PI_HOST:?set PI_HOST to the name people open}
      PI_TLS: ${PI_TLS:-auto}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # For a *.ts.net name: Caddy asks the host's Tailscale for its certificate.
      - ${TAILSCALE_SOCKET:-/var/run/tailscale}:/var/run/tailscale
    networks: [pi-phone]

volumes:
  pi-phone-data:
  caddy-data:
  caddy-config:

networks:
  pi-phone:
