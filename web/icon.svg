<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
	<!--
		pi-phone's icon: a heavy lowercase p with a cursor block at its foot, white on electric blue. The PNGs beside
		it, Android's legacy launcher icon, and its adaptive icon's layers (android/app/src/main/res/drawable/ic_launcher_*.xml,
		the same paths) are drawn from it: node scripts/icons.ts.
	-->
	<defs>
		<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#3a63ff" />
			<stop offset="1" stop-color="#1c34c9" />
		</linearGradient>
	</defs>
	<rect width="512" height="512" fill="url(#tile)" />
	<g id="mark" transform="translate(-29 -24)">
		<path d="M184 156 V420" fill="none" stroke="#ffffff" stroke-width="62" stroke-linecap="round" />
		<circle cx="282" cy="236" r="98" fill="none" stroke="#ffffff" stroke-width="62" />
		<rect x="356" y="372" width="62" height="48" rx="12" fill="#7dffb2" />
	</g>
</svg>
